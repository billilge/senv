# Coolify 배포용 (PRD 4.5): Docker Compose 리소스 stream-env-app
# - api와 worker는 같은 이미지를 쓰고 실행 명령만 다르다. api가 시작할 때 마이그레이션을 적용한다.
# - 값은 Coolify 환경변수 화면에서 넣는다. `:?`가 붙은 값이 비면 배포가 멈춘다.
# - Coolify에서 api 서비스의 도메인을 https://senv.stream.billilge.site:3000 으로 지정한다
#   (뒤의 :3000은 컨테이너 포트. 밖으로는 Traefik이 443으로 연다).
services:
  api:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      PORT: "3000"
      APP_URL: ${APP_URL:?}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DATABASE_URL: ${DATABASE_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      SENV_KEK: ${SENV_KEK:?}
      SENV_KEK_ID: ${SENV_KEK_ID:?}
      SENV_KEK_PREVIOUS: ${SENV_KEK_PREVIOUS:-}
      SESSION_SECRET: ${SESSION_SECRET:?}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
      GITHUB_ORG: ${GITHUB_ORG:-billilge}
      SENV_BOOTSTRAP_ADMINS: ${SENV_BOOTSTRAP_ADMINS:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build: .
    restart: unless-stopped
    init: true
    command: ["node", "dist/worker.js"]
    environment:
      # worker는 배포 대상 동기화(값을 풀어 Coolify에 쓰기)와 만료 기록 정리를 한다.
      # 그래서 DB·R2·KEK를 받고, OAuth 시크릿과 세션 비밀은 api에만 준다 (결정 33)
      DATABASE_URL: ${DATABASE_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      SENV_KEK: ${SENV_KEK:?}
      SENV_KEK_ID: ${SENV_KEK_ID:?}
      SENV_KEK_PREVIOUS: ${SENV_KEK_PREVIOUS:-}
    depends_on:
      # api가 마이그레이션을 마치고 healthy가 된 뒤에 띄운다
      api:
        condition: service_healthy
