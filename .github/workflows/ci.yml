# 검사 (PRD 4.2, 결정 58): main 푸시와 PR마다 돈다
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 린트·타입·빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 통합 테스트는 Testcontainers로 MySQL을 띄운다 (러너에 Docker가 있다)
      - run: pnpm verify

  browser:
    name: 브라우저 E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 로컬은 설치된 Chrome을 쓰고, CI만 Chromium을 받는다 (결정 57)
      - run: pnpm --filter @senv/e2e exec playwright install --with-deps chromium
      - run: pnpm test:browser
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7

  image:
    name: 배포 이미지 검사
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # docker-compose.yml을 검사용 MySQL과 함께 띄워 마이그레이션·헬스체크·대시보드·API·worker를 본다
      - run: bash scripts/docker-smoke.sh
